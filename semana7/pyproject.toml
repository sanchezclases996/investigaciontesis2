[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-routing"
version = "0.1.0"
description = "Pipeline reproducible: routing predictivo en consultas académicas-administrativas (UMA)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Carlos César Sánchez Coronel" },
  { name = "Freud Enrique Melgar Aliaga" },
]
dependencies = [
  "pandas>=2.2",
  "polars>=1.0",
  "scikit-learn>=1.5",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "joblib>=1.4",
  "matplotlib>=3.8",
  "shap>=0.45",
  "rank-bm25>=0.2.2",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
